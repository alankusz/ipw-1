<!DOCTYPE html>                                                               
  <html lang="pl">                                                              
  <head>                                                                        
    <meta charset="UTF-8">                                                      
    <meta name="viewport" content="width=device-width, initial-scale=1.0,       
  maximum-scale=1.0, user-scalable=no">                                         
    <title>Indywidualny Plan Wdro&#380;enia</title>                             
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500
  ;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">       
    <style>                                                                     
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; } 
                                                                                
      :root {                                                                   
        --primary: #32373c;                                                     
        --primary-hover: #23272b;                                               
        --accent: #0693e3;                                                      
        --accent-light: #e8f4fd;                                                
        --bg: #f7f8fa;                                                          
        --card: #ffffff;                                                        
        --text: #1e1e1e;                                                        
        --text-light: #6b7280;                                                  
        --text-muted: #9ca3af;                                                  
        --border: #e5e7eb;                                                      
        --success: #10b981;                                                     
        --success-bg: #ecfdf5;                                                  
        --error: #ef4444;                                                       
        --error-bg: #fef2f2;                                                    
        --radius: 8px;                                                          
        --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 6px 16px rgba(0,0,0,0.04);      
        --shadow-hover: 0 2px 8px rgba(0,0,0,0.08), 0 8px 24px rgba(0,0,0,0.06);
      }                                                                         
                                                                                
      html { font-size: 16px; -webkit-text-size-adjust: 100%; }                 
                                                            
      body {                                                                    
        font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI',
  sans-serif;                                                                   
        background: var(--bg);
        color: var(--text);                                                     
        line-height: 1.6;                                                       
        min-height: 100vh;                                                      
        padding-bottom: 40px;                                                   
      }                                                                         
                                                                                
      .top-bar {                                                                
        background: #ffffff;                                
        padding: 14px 16px 12px;                                                
        text-align: center;                                                     
        border-bottom: 3px solid var(--primary);                                
      }                                                                         
                                                                                
      .top-bar img {                                                            
        height: 40px;                                                           
        display: inline-block;                                                  
        vertical-align: middle;                                                 
      }                                                                         
                                                                                
      .container { max-width: 640px; margin: 0 auto; padding: 16px; }           
                                                                                
      .header { text-align: center; padding: 28px 16px 20px; }                  
                                                            
      .header-icon {                                                            
        width: 52px; height: 52px;                          
        background: var(--primary);                                             
        border-radius: 12px;                                                    
        display: inline-flex; align-items: center; justify-content: center;     
        margin-bottom: 14px;                                                    
        box-shadow: 0 4px 12px rgba(50,55,60,0.25);                             
      }                                                                         
                                                                                
      .header-icon svg { width: 24px; height: 24px; fill: #fff; }               
                                                            
      .header h1 {                                                              
        font-family: 'Oswald', sans-serif;                  
        font-size: 1.5rem;                                                      
        font-weight: 600;                                                       
        color: var(--primary);                                                  
        letter-spacing: 0.5px;                                                  
        margin-bottom: 8px;                                                     
      }                                                                         
                                                                                
      .header p {                                                               
        font-size: 0.88rem;                                 
        color: var(--text-light);                                               
        max-width: 420px;                                                       
        margin: 0 auto;                                                         
        font-weight: 300;                                                       
      }                                                                         
                                                                                
      .param-info {                                                             
        margin-top: 12px;                                   
        font-size: 0.78rem;                                                     
        color: var(--primary);                                                  
        font-weight: 500;                                                       
        background: #eef0f2;                                                    
        padding: 7px 14px;                                                      
        border-radius: 6px;                                                     
        display: inline-block;                                                  
      }                                                                         
                                                                                
      /* INSTRUCTIONS */                                                        
      .instructions {                                                           
        background: var(--accent-light);                                        
        border: 1px solid #c8e3f6;                                              
        border-radius: var(--radius);                                           
        padding: 16px 18px;                                                     
        margin-bottom: 16px;                                                    
        font-size: 0.82rem;                                                     
        color: #1a5276;                                                         
        line-height: 1.6;                                                       
      }                                                                         
                                                                                
      .instructions-title {                                                     
        font-family: 'Oswald', sans-serif;                  
        font-weight: 500;                                                       
        font-size: 0.85rem;                                                     
        text-transform: uppercase;                                              
        letter-spacing: 0.5px;                                                  
        margin-bottom: 8px;                                                     
        display: flex;                                                          
        align-items: center;                                                    
        gap: 6px;                                                               
        color: #1a5276;                                                         
      }                                                                         
                                                                                
      .instructions ol {                                                        
        margin: 0;                                          
        padding-left: 18px;                                                     
      }                                                                         
                                                                                
      .instructions li {                                                        
        margin-bottom: 4px;                                 
      }                                                                         
                                                                                
      .instructions li:last-child {                                             
        margin-bottom: 0;                                                       
      }                                                                         
                                                            
      /* CARDS */                                                               
      .card {
        background: var(--card);                                                
        border-radius: var(--radius);                                           
        box-shadow: var(--shadow);                                              
        padding: 22px;                                                          
        margin-bottom: 14px;                                                    
        border: 1px solid var(--border);                                        
        transition: box-shadow 0.2s;                                            
      }                                                                         
                                                                                
      .card:focus-within { box-shadow: var(--shadow-hover); }                   
                                                            
      .card-title {                                                             
        font-family: 'Oswald', sans-serif;                  
        font-size: 0.9rem;                                                      
        font-weight: 500;                                                       
        color: var(--primary);                                                  
        margin-bottom: 16px;                                                    
        display: flex;                                                          
        align-items: center;                                                    
        gap: 8px;                                                               
        text-transform: uppercase;                                              
        letter-spacing: 0.8px;                                                  
      }                                                                         
                                                                                
      .card-title .badge {                                                      
        font-family: 'Roboto', sans-serif;                  
        font-size: 0.62rem;                                                     
        font-weight: 500;                                                       
        padding: 2px 9px;                                                       
        border-radius: 4px;                                                     
        background: var(--accent-light);                                        
        color: var(--accent);                                                   
        text-transform: lowercase;                                              
        letter-spacing: 0;                                                      
      }                                                                         
                                                                                
      .card-title .badge.optional { background: #f3f4f6; color:                 
  var(--text-muted); }
                                                                                
      .field { margin-bottom: 14px; }                                           
      .field:last-child { margin-bottom: 0; }
                                                                                
      label {                                                                   
        display: block;                                                         
        font-size: 0.8rem;                                                      
        font-weight: 500;                                                       
        color: var(--text);                                                     
        margin-bottom: 5px;                                                     
      }                                                                         
                                                                                
      label .hint { font-weight: 300; color: var(--text-muted); font-size:      
  0.76rem; }                                                
                                                                                
      input[type="text"], input[type="email"], input[type="date"], textarea {   
        width: 100%; padding: 11px 14px;
        font-size: 0.95rem;                                                     
        font-family: 'Roboto', sans-serif;                                      
        font-weight: 300;                                                       
        border: 1.5px solid var(--border);                                      
        border-radius: 6px;                                                     
        background: #fff;                                                       
        color: var(--text);                                                     
        transition: border-color 0.2s, box-shadow 0.2s;                         
        -webkit-appearance: none; appearance: none;                             
      }                                                                         
                                                                                
      input:focus, textarea:focus {                                             
        outline: none;                                      
        border-color: var(--accent);                                            
        box-shadow: 0 0 0 3px rgba(6, 147, 227, 0.1);                           
      }                                                                         
                                                                                
      input::placeholder, textarea::placeholder { color: var(--text-muted);     
  font-weight: 300; }                                                           
      textarea { min-height: 80px; resize: vertical; line-height: 1.5; }        
                                                                                
      .action-item { border-left: 3px solid var(--primary); }                   
                                                                                
      .action-number {                                                          
        width: 26px; height: 26px;                          
        background: var(--primary);                                             
        color: #fff;                                                            
        border-radius: 6px;                                                     
        display: inline-flex; align-items: center; justify-content: center;     
        font-size: 0.8rem; font-weight: 600; flex-shrink: 0;                    
        font-family: 'Oswald', sans-serif;                                      
      }                                                                         
                                                                                
      .card-title-row { display: flex; align-items: center; width: 100%; }      
                                                                                
      .hidden { display: none !important; }                                     
                                                            
      .submit-btn {                                                             
        width: 100%; padding: 16px 24px;                    
        background: var(--primary); color: #fff;                                
        border: none; border-radius: var(--radius);                             
        font-size: 1rem; font-weight: 500;                                      
        cursor: pointer; transition: all 0.2s;                                  
        font-family: 'Roboto', sans-serif;                                      
        display: flex; align-items: center; justify-content: center; gap: 10px; 
        letter-spacing: 0.5px;                                                  
        box-shadow: 0 4px 12px rgba(50,55,60,0.2);                              
      }                                                                         
                                                                                
      .submit-btn:hover { background: var(--primary-hover); box-shadow: 0 6px   
  20px rgba(50,55,60,0.3); transform: translateY(-1px); }   
      .submit-btn:active { transform: scale(0.98); }                            
      .submit-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none;
   }                                                                            
                                                                                
      .spinner {                                                                
        width: 20px; height: 20px;                          
        border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff;        
        border-radius: 50%; animation: spin 0.7s linear infinite;               
      }                                                                         
                                                                                
      @keyframes spin { to { transform: rotate(360deg); } }                     
                                                                                
      .message {                                                                
        padding: 14px 18px; border-radius: var(--radius);   
        margin-bottom: 14px; font-size: 0.9rem; display: none;                  
      }                                                                         
                                                                                
      .message.show { display: flex; align-items: flex-start; gap: 10px; }      
      .message.error { background: var(--error-bg); color: #991b1b; border: 1px
  solid #fecaca; }                                                              
      .message-icon { font-size: 1.2rem; flex-shrink: 0; line-height: 1.3; }
                                                                                
      /* SUCCESS */                                                             
      .success-screen { text-align: center; padding: 60px 20px; }               
                                                                                
      .success-checkmark {                                                      
        width: 76px; height: 76px;                                              
        background: var(--success);                                             
        border-radius: 50%;                                                     
        display: inline-flex; align-items: center; justify-content: center;     
        margin-bottom: 20px;                                                    
        animation: scaleIn 0.4s ease-out;                                       
      }                                                                         
                                                                                
      .success-checkmark svg { width: 38px; height: 38px; fill: #fff; }         
                                                                                
      @keyframes scaleIn {                                                      
        0% { transform: scale(0); opacity: 0; }             
        60% { transform: scale(1.1); }                                          
        100% { transform: scale(1); opacity: 1; }                               
      }                                                                         
                                                                                
      .success-screen h2 {                                                      
        font-family: 'Oswald', sans-serif;                  
        font-size: 1.4rem; font-weight: 600;                                    
        color: var(--primary); margin-bottom: 8px;                              
      }                                                                         
                                                                                
      .success-screen p { color: var(--text-light); font-size: 0.92rem;         
  font-weight: 300; }                                       
                                                                                
      .new-form-btn {                                                           
        margin-top: 24px; padding: 12px 24px;
        background: #eef0f2; color: var(--primary);                             
        border: none; border-radius: 6px;                                       
        font-size: 0.92rem; font-weight: 500;                                   
        cursor: pointer; font-family: 'Roboto', sans-serif; transition:         
  background 0.2s;                                                              
      }                                                                         
                                                                                
      .new-form-btn:hover { background: #dfe2e6; }                              
                                                                                
      .footer {                                                                 
        text-align: center;                                 
        padding: 20px 16px 4px;                                                 
        font-size: 0.72rem;                                                     
        color: var(--text-muted);                                               
        font-weight: 300;                                                       
      }                                                                         
                                                                                
      @media (max-width: 480px) {                                               
        .container { padding: 12px; }                                           
        .header { padding: 24px 12px 16px; }                                    
        .header h1 { font-size: 1.3rem; }                                       
        .card { padding: 18px; }                                                
        textarea { min-height: 70px; }                                          
        .instructions { padding: 14px 14px; font-size: 0.8rem; }                
      }                                                                         
    </style>                                                                    
  </head>                                                                       
  <body>                                                                        
                                                                                
  <div class="top-bar">
